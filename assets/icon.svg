           C70 210 45 165 45 125
           C45 85 70 40 125 40
           Z"
        fill="none" stroke="#C0392B" stroke-width="12" stroke-linejoin="round"/>
  <path d="M125 50
           C110 78 143 96 129 125
           C115 154 148 172 125 200"
        fill="none" stroke="#C0392B" stroke-width="12" stroke-linecap="round"/>
</svg>
