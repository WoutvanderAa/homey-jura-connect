<!-- App icon. Homey's App Store guidelines (linked from the certification
     rejection) explicitly forbid filled illustrations/background colours
     here -- outline-only vector work on a transparent background, distinct
     from the driver image (which shows the actual machine). A coffee bean
     rather than a cup so it doesn't collide with the driver image's own
     cup-adjacent framing, and carries no Jura branding.
     Regenerate previews with: sharp(this).resize(N,N).png() -->
