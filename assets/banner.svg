<!-- Source for assets/images/{large,small}.png (500x350 / 250x175 banners).
     Same icon as icon.svg, recomposed for the wide banner aspect ratio.
     Regenerate with: sharp(this).resize(500,350|250,175).png() -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">
  <defs>
    <linearGradient id="bg" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#6B4A38"/>
      <stop offset="100%" stop-color="#3E2A1E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="500" height="350" fill="url(#bg)"/>
  <g transform="translate(0,-87) scale(2.0)">
    <ellipse cx="115" cy="177" rx="32" ry="4" fill="#000000" opacity="0.12"/>
    <rect x="77" y="108" width="76" height="66" rx="10" fill="#FFFFFF"/>
    <path d="M153 122 a19 19 0 0 1 0 40" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round"/>
    <g stroke="#F3EFEA" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M97 98 q8 -8 0 -16 q-8 -8 0 -16"/>
      <path d="M115 98 q8 -8 0 -16 q-8 -8 0 -16"/>
      <path d="M133 98 q8 -8 0 -16 q-8 -8 0 -16"/>
    </g>
  </g>
</svg>
