<!-- Custom icon for the alarm_tray capability (tray/grounds full,
     needs emptying): empty_tray + empty_grounds, both 100% coverage
     across the 72 bundled profiles, see lib/profiles/README.md. See
     alarm_tray_missing.svg for the separate "tray not inserted at
     all" alarm (insert_tray). Pure stroke linework, fill:none, so it
     survives Homey's monochrome capability-icon mask cleanly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <path d="M28 32 h44 l-6 46 a6 6 0 0 1 -6 6 h-20 a6 6 0 0 1 -6 -6 z"
        fill="none" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
  <line x1="22" y1="32" x2="78" y2="32" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
</svg>
